[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-dep-upgrade"
version = "0.2.1"
description = "Dependency Upgrade: a NanoAgent plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The catalog, its locks, the pinned interpreters and the pytest recorder ship inside the package.
plugin = ["data/*.json", "data/locks/*.txt", "runners/*.py", "tools_dev/*.json"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120
# The 0.1 hand-built projects stay in git history only.
extend-exclude = ["src/plugin/instances"]

[tool.pytest.ini_options]
# contract.py and verifier/ live at the plugin root.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: needs GitHub and PyPI; set NANOAGENT_NETWORK=1 to run"]
