[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-dep-upgrade"
version = "0.1.0"
description = "Dependency Upgrade: a NanoAgent plugin"
# The shipped projects pin old releases whose wheels exist for Python 3.12; their venvs are built
# on this interpreter, so it stays a 3.12.
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.27,<2", "slimconfig"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plugin = ["instances/**/*", "runners/*.py"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120
# The shipped projects are written for their old library versions and lint as their own projects.
extend-exclude = ["src/plugin/instances"]

[tool.pytest.ini_options]
# contract.py and verifier/ live at the plugin root.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: needs PyPI; set NANOAGENT_NETWORK=1 to run"]
