_ > nanoagent.plugin.manifest.ManifestConfig:
id: dep-upgrade
name: Dependency Upgrade
version: 0.2.0
status: ready
nanoagent: ~=0.5.0

runtime > nanoagent.plugin.manifest.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.manifest.PermissionsConfig:
  network > nanoagent.plugin.manifest.NetworkConfig:
    hosts: [codeload.github.com, pypi.org, files.pythonhosted.org, releases.astral.sh]
  filesystem > nanoagent.plugin.manifest.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.manifest.ToolConfig]:
  pin_upgrade:
    description: Pin the answer key for an instance from its catalog entry and PyPI's files for the target release; the task's reference
  start_upgrade:
    description: Check the real repository out at the commit before its upstream upgrade, under dep-upgrade/<instance>/, and install its pre-upgrade environment; call again if complete is false
  list_files:
    description: List files and folders under a workspace path, recursively, sorted and paginated
  read_file:
    description: Read up to 200 lines (8 KB) of a text file in the workspace
  search:
    description: Search files under a workspace folder for a regular expression, up to 50 hits
  edit_file:
    description: Replace exact text in the spec file or the package's source (each old text must occur once), all or none; then optionally sync, or sync and run the public tests
  write_file:
    description: Write 1 to 5 whole files (the spec file or source under the editable globs), all or none; then optionally sync, or sync and run the public tests
  sync:
    description: Re-lock the project from its spec as of the instance's date, every other package held, and install that lock; returns the locked and installed version
  run_tests:
    description: Run the repository's tests on the current code; returns counts, failing judged tests and the log's tail
  judge:
    description: Judge the final state in stages (diff, lock, install, build, public tests, hidden tests, import probe, shim scan) and record it; call again if complete is false

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.manifest.TaskConfig]:
  upgrade-dependency:
    description: Redo a real open-source project's upgrade of one dependency to its new major version, changing the code so the project builds and its own and upstream's tests pass
    runner: agent
    tools: [start_upgrade, list_files, read_file, search, edit_file, write_file, sync, run_tests, judge]
    reference: pin_upgrade
    instructions: |-
      1. Call start_upgrade with the task's instance (again while complete is false). It checks the real repository out under its root at the commit before upstream's upgrade and returns the dependency with its current and target versions, the spec file and the requirement it states now, the editable globs, where the source imports the dependency (uses), the public tests that break on the new version with their first error (breaking), the tests that are not judged (excluded_tests) and the rules. Every path you pass to other tools starts with that root.
      2. Read the source the breaking errors point at (read_file; search for other uses). Tests, docs and every file outside the editable globs are read-only.
      3. Make the upgrade in one edit_file call with then: sync_and_test: raise the dependency's requirement in the spec file so it admits the target (keep every other requirement as written) and migrate the source to the new version's API with exact old -> new replacements, each old text copied from the file and occurring once. No shims: no warning filters, no monkeypatching or re-exporting the library, no sys.modules tricks, no version or test sniffing.
      4. If the sync fails or judged tests still fail, fix exactly that with one more edit_file (then: sync_and_test).
      5. Call judge, and in the same step call submit with: instance, dependency, from_version and to_version as start_upgrade gave them, requirement (the dependency's requirement as the spec now states it), changed_files (every file you changed, relative to root) and migration (1 to 8 notes of 10 to 200 characters, one per change). If judge answers complete false, call it again before your answer.
