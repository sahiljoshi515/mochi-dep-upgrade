[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ledger"
version = "0.9.2"
description = "A small double-entry ledger on SQLAlchemy: accounts, entries, imports and reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=1.4.50,<1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
