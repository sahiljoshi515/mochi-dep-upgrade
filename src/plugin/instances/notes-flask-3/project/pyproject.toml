[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notes"
version = "2.3.1"
description = "A small Flask API and site for personal notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=2.2,<2.3",
    "werkzeug>=2.2,<2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
