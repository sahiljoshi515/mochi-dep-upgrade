[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arrays"
version = "1.1.0"
description = "Small numeric helpers on NumPy: loading, statistics, smoothing, binning, geometry and export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arrays"]

[tool.pytest.ini_options]
testpaths = ["tests"]
