[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "salesreport"
version = "0.6.0"
description = "Sales reports from whitespace-separated exports, on pandas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1,<2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/salesreport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
